# fly.toml — quire.hiddenbridge.io, the documentation site
#
# Hand-maintained. Do not run `fly launch` against this app: it rewrites this file.
# Deploy with `just site deploy`, which builds from the repo root.

app = 'quire-hiddenbridge-io'
primary_region = 'lhr'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # /_quire/health is engine-built-in: 200 text, no templ.
  # Host is the site's own name, so the check is not answered with a redirect.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/_quire/health'
    [http_service.checks.headers]
      Host = 'quire.hiddenbridge.io'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
