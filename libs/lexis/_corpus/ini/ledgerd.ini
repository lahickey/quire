; ledgerd.service - the ledger daemon, with its socket and a timer for backups.
# Lines starting with either mark are comments.

[Unit]
Description=Ledger service
Documentation=https://example.com/ledgerd/docs man:ledgerd(8)
After=network-online.target postgresql.service
Wants=network-online.target
Requires=ledgerd.socket
ConditionPathExists=/etc/ledgerd/config.toml
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Type=notify
User=ledger
Group=ledger
WorkingDirectory=/var/lib/ledgerd
EnvironmentFile=-/etc/ledgerd/env
Environment="LEDGER_LOG=json" "LEDGER_ADDR=:8080"
ExecStartPre=/usr/bin/ledgerd migrate --config /etc/ledgerd/config.toml
ExecStart=/usr/bin/ledgerd serve \
    --config /etc/ledgerd/config.toml \
    --workers 4
ExecReload=/bin/kill -HUP $MAINPID
Restart=on-failure
RestartSec=2s
TimeoutStopSec=30
WatchdogSec=20

; Hardening
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=true
ReadWritePaths=/var/lib/ledgerd /var/log/ledgerd
CapabilityBoundingSet=
SystemCallFilter=@system-service ~@privileged
MemoryMax=512M
LimitNOFILE=65536

[Install]
WantedBy=multi-user.target
Also=ledgerd.socket

[Socket]
ListenStream=0.0.0.0:8080
ListenStream=[::]:8080
Backlog=1024
NoDelay=true
ReusePort = true

[Timer]
OnCalendar=*-*-* 03:15:00
RandomizedDelaySec=15min
Persistent=true
Unit=ledgerd-backup.service

[database]
host = db.internal
port = 5432
name = ledger
user = ledger
password = "s3cret; not a comment"
pool_size = 20
timeout = 2.5
ssl = require
options = -c statement_timeout=5000 -c lock_timeout=1000

[cache]
enabled = on
backend = redis
url = redis://cache.internal:6379/0
ttl = 300
prefix = ledger:

[logging]
level = info
format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
file = /var/log/ledgerd/app.log
rotate = daily
keep = 14

[feature "exports"]
enabled = false
formats = csv, json, parquet
max_rows = 1000000

[feature "webhooks"]
enabled = true
retry = 3
backoff = 1.5
secret =
